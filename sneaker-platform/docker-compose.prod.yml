# Üretim kurulumu: PostgreSQL + uygulama + Caddy (otomatik SSL, satıcı alan adları için on-demand TLS)
# Kullanım: .env.production dosyasını doldurun, sonra: docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sneaker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: sneaker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sneaker"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://sneaker:${POSTGRES_PASSWORD}@db:5432/sneaker
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PANEL_HOST: ${PANEL_HOST:?PANEL_HOST gerekli (örn. panel.sneakeros.com)}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL gerekli}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
